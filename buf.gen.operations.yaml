version: v2
plugins:
  - remote: buf.build/connectrpc/go
    out: gen/go
    opt:
      - paths=source_relative
    types:
      - google.longrunning.Operations
  - remote: buf.build/bufbuild/es:v2.12.1
    out: frontend/src/gen
    opt:
      - target=ts
    types:
      - google.longrunning
      - google.rpc.Status
inputs:
  - module: buf.build/googleapis/googleapis
    types:
      - google.longrunning
      - google.rpc.Status
